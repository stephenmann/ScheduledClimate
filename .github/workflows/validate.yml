name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed bundle
        run: git diff --exit-code ../custom_components/scheduled_climate/frontend

  tests:
    name: Tests (${{ matrix.homeassistant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant:
          - name: Minimum
            package: homeassistant==2025.1.0
          - name: Latest
            package: homeassistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          "${{ matrix.homeassistant.package }}"
          "pytest-homeassistant-custom-component>=0.13.200"
          "pytest-cov>=6.0"
          "ruff>=0.9.0"

      - name: Lint
        run: python -m ruff check custom_components tests

      - name: Test
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration